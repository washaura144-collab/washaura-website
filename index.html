<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Washaura – Premium Doorstep Car Detailing in Raipur</title>
  <meta name="description" content="Washaura offers premium doorstep car wash, interior detailing, and paint protection services in Raipur. Book on WhatsApp in 60 seconds."/>
  <meta property="og:title" content="Washaura – Premium Doorstep Car Detailing"/>
  <meta property="og:description" content="Showroom-level finish at your doorstep. Book now on WhatsApp."/>
  <meta property="og:type" content="website"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <style>
    /* ===========================
       ROOT & RESET
    =========================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #070d18;
      --bg2:      #0d1525;
      --bg3:      #111e33;
      --card:     rgba(255,255,255,0.05);
      --border:   rgba(255,255,255,0.10);
      --primary:  #00c2ff;
      --gold:     #f0c040;
      --white:    #f0f4ff;
      --muted:    #8a9bbf;
      --r:        16px;
      --shadow:   0 8px 40px rgba(0,0,0,0.45);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img { display: block; max-width: 100%; }
    section { padding: 80px 0; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
    .section-label {
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--primary); margin-bottom: 12px;
    }
    .section-title {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800; line-height: 1.2; color: var(--white);
    }
    .section-sub {
      margin-top: 12px; color: var(--muted);
      font-size: 16px; max-width: 600px;
    }
    .section-head { margin-bottom: 48px; }
    .section-head.center { text-align: center; }
    .section-head.center .section-sub { margin: 12px auto 0; }
    .highlight { color: var(--primary); }
    .gold { color: var(--gold); }

    /* ===========================
       BUTTONS
    =========================== */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 999px;
      font-weight: 700; font-size: 15px;
      cursor: pointer; border: none; transition: all .25s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary); color: #000;
    }
    .btn-primary:hover { background: #33cfff; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,194,255,0.35); }
    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.25);
      color: var(--white);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { background: #f5d06a; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(240,192,64,0.35); }
    .btn-wa {
      background: #25d366; color: #fff;
    }
    .btn-wa:hover { background: #1ebe59; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(37,211,102,0.35); }

    /* ===========================
       NAVBAR
    =========================== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: rgba(7,13,24,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 18px 24px; max-width: 1140px; margin: 0 auto;
    }
    .nav-logo {
      font-family: 'Manrope', sans-serif;
      font-size: 22px; font-weight: 800;
      color: var(--white);
    }
    .nav-logo span { color: var(--primary); }
    .nav-links { display: flex; gap: 32px; }
    .nav-links a {
      font-size: 14px; font-weight: 600;
      color: var(--muted); transition: color .2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-cta { display: flex; gap: 12px; align-items: center; }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none; padding: 4px;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--white); border-radius: 2px; transition: all .3s;
    }
    .mobile-menu {
      display: none; flex-direction: column;
      gap: 0; background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .mobile-menu a {
      padding: 16px 24px; font-size: 15px; font-weight: 600;
      color: var(--muted); border-bottom: 1px solid var(--border);
      transition: color .2s;
    }
    .mobile-menu a:hover { color: var(--primary); }
    .mobile-menu.open { display: flex; }

    /* ===========================
       HERO
    =========================== */
    .hero {
      min-height: 100vh;
      display: flex; align-items: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,194,255,0.12) 0%, transparent 70%),
                  var(--bg);
      padding: 120px 0 80px;
    }
    .hero-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px; align-items: center;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,194,255,0.10);
      border: 1px solid rgba(0,194,255,0.25);
      border-radius: 999px; padding: 8px 16px;
      font-size: 13px; font-weight: 600; color: var(--primary);
      margin-bottom: 24px;
    }
    .hero-title {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 800; line-height: 1.1;
      margin-bottom: 20px;
    }
    .hero-sub {
      font-size: 17px; color: var(--muted);
      margin-bottom: 32px; max-width: 520px; line-height: 1.7;
    }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 36px; }
    .hero-trust {
      display: flex; gap: 28px; flex-wrap: wrap;
    }
    .trust-chip {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted);
    }
    .trust-chip svg { color: var(--gold); flex-shrink: 0; }
    .hero-img {
      position: relative; border-radius: 24px; overflow: hidden;
    }
    .hero-img img {
      width: 100%; height: 460px; object-fit: cover;
      border-radius: 24px;
    }
    .hero-img-badge {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(7,13,24,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 20px;
    }
    .hero-img-badge strong { display: block; font-size: 22px; font-family: 'Manrope', sans-serif; }
    .hero-img-badge span { font-size: 12px; color: var(--muted); }

    /* ===========================
       TRUST BAR
    =========================== */
    .trust-bar {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }
    .trust-bar-inner {
      display: flex; justify-content: center;
      gap: 48px; flex-wrap: wrap;
    }
    .tbar-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600; color: var(--muted);
    }
    .tbar-item svg { color: var(--primary); }

    /* ===========================
       SERVICES
    =========================== */
    .services { background: var(--bg); }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .serv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);

    .serv-icon {

      border-radius: 14px;

      color: var(--primary);

    .serv-card h3 {
      font-family: 'Manrope', sans-serif;
      font-size: 18px; font-weight: 700; margin-bottom: 10px;
    }
    .serv-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

    /* ===========================
       PACKAGES
    =========================== */
    .packages { background: var(--bg2); }
    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px; align-items: start;
    }
    .pkg-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 32px 28px;
      transition: all .3s;

    .pkg-card.featured {

    .pkg-badge.gold { background: rgba(240,192,64,0.15); color: var(--gold); }

      font-size: 22px; font-weight: 800; margin-bottom: 4px;

    .pkg-price {

    .pkg-price.gold-price { color: var(--gold); }
    .pkg-price-note { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    .pkg-features { margin-bottom: 28px; }
    .pkg-features li {
      font-size: 14px; color: var(--muted);
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 10px;
    }
    .pkg-features li:last-child { border-bottom: none; }
    .pkg-features li svg { color: var(--primary); flex-shrink: 0; margin-top: 2px; }
    .pkg-tag { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

    /* ===========================
       HOW IT WORKS
    =========================== */
    .how { background: var(--bg); }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 28px 22px;
      text-align: center;
    }
    .step-num {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(0,194,255,0.12);
      border: 1.5px solid rgba(0,194,255,0.30);
      color: var(--primary);
      font-family: 'Manrope', sans-serif;
      font-weight: 800; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
    }
    .step-card h4 {
      font-family: 'Manrope', sans-serif;
      font-size: 16px; font-weight: 700; margin-bottom: 8px;
    }
    .step-card p { font-size: 14px; color: var(--muted); }

    /* ===========================
       UPCOMING SERVICES
    =========================== */
    .upcoming {
      background: radial-gradient(ellipse 80% 50% at 50% 50%, rgba(240,192,64,0.06) 0%, transparent 70%),
                  var(--bg2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .upcoming-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(240,192,64,0.10);
      border: 1px solid rgba(240,192,64,0.25);
      border-radius: 999px; padding: 6px 14px;
      font-size: 12px; font-weight: 700;
      color: var(--gold); letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .upcoming-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px; margin-top: 12px;
    }
    .up-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 28px 24px;
      transition: all .3s;
      position: relative; overflow: hidden;
    }
    .up-card::before {
      content: 'COMING SOON';
      position: absolute; top: 16px; right: -28px;
      background: rgba(240,192,64,0.15);
      color: var(--gold); font-size: 9px; font-weight: 800;
      letter-spacing: 1.5px; padding: 5px 36px;
      transform: rotate(45deg);
    }
    .up-card.featured-up {
      background: linear-gradient(160deg, rgba(240,192,64,0.10), rgba(255,255,255,0.04));
      border-color: rgba(240,192,64,0.30);
    }
    .up-card:hover {
      transform: translateY(-4px);
      border-color: rgba(240,192,64,0.40);
      box-shadow: 0 16px 48px rgba(240,192,64,0.08);
    }
    .up-icon {
      width: 52px; height: 52px;
      background: rgba(240,192,64,0.10);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px; color: var(--gold);
    }
    .up-card h3 {
      font-family: 'Manrope', sans-serif;
      font-size: 19px; font-weight: 800; margin-bottom: 6px;
    }
    .up-card .up-tag {
      font-size: 11px; color: var(--gold);
      font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .up-card p { font-size: 14px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
    .up-card ul { margin-bottom: 22px; }
    .up-card ul li {
      font-size: 13px; color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .up-card ul li:last-child { border-bottom: none; }
    .up-card ul li svg { color: var(--gold); flex-shrink: 0; margin-top: 2px; }
    .upcoming-note {
      margin-top: 32px; text-align: center;
      font-size: 13px; color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 24px;
      max-width: 700px; margin: 32px auto 0;
    }

    /* ===========================
       GALLERY
    =========================== */
    .gallery { background: var(--bg); }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .gallery-item {
      border-radius: var(--r); overflow: hidden;
      aspect-ratio: 4/3;
    }
    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .4s;
    }
    .gallery-item:hover img { transform: scale(1.05); }

    /* ===========================
       TESTIMONIALS
    =========================== */
    .reviews { background: var(--bg2); }
    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .review-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 28px 24px;
    }
    .stars { color: var(--gold); font-size: 16px; margin-bottom: 14px; }
    .review-text {
      font-size: 14px; color: var(--muted);
      line-height: 1.7; margin-bottom: 20px;
      font-style: italic;
    }
    .reviewer {
      display: flex; align-items: center; gap: 12px;
    }
    .reviewer-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0,194,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Manrope', sans-serif;
      font-weight: 800; font-size: 16px; color: var(--primary);
    }
    .reviewer-name { font-weight: 700; font-size: 15px; }
    .reviewer-info { font-size: 12px; color: var(--muted); }

    /* ===========================
       FAQ
    =========================== */
    .faq { background: var(--bg); }
    .faq-list { max-width: 820px; margin: 0 auto; }
    .faq-item {
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .faq-q {
      width: 100%; display: flex;
      align-items: center; justify-content: space-between;
      padding: 20px 24px;
      background: var(--card);
      font-family: 'Manrope', sans-serif;
      font-size: 16px; font-weight: 700;
      color: var(--white); cursor: pointer;
      border: none; text-align: left;
      transition: background .2s;
    }
    .faq-q:hover { background: rgba(255,255,255,0.08); }
    .faq-q svg { flex-shrink: 0; color: var(--primary); transition: transform .3s; }
    .faq-q.open svg { transform: rotate(45deg); }
    .faq-a {
      display: none; padding: 0 24px 20px;
      font-size: 14px; color: var(--muted); line-height: 1.7;
      background: var(--card);
    }
    .faq-a.open { display: block; }

    /* ===========================
       CONTACT
    =========================== */
    .contact { background: var(--bg2); }
    .contact-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px; align-items: start;
    }
    .contact-info-item {
      display: flex; gap: 16px; margin-bottom: 24px;
    }
    .contact-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      background: rgba(0,194,255,0.10);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .contact-info-item h4 {
      font-family: 'Manrope', sans-serif;
      font-size: 15px; font-weight: 700; margin-bottom: 4px;
    }
    .contact-info-item p, .contact-info-item a {
      font-size: 14px; color: var(--muted); transition: color .2s;
    }
    .contact-info-item a:hover { color: var(--primary); }
    .contact-form { display: flex; flex-direction: column; gap: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .form-group input,
    .form-group select,

      padding: 14px 16px;
      color: var(--white);

      outline: none; transition: border .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); }
    .form-group select option { background: var(--bg2); color: var(--white); }
    .form-group textarea { resize: vertical; min-height: 110px; }
    .form-submit { margin-top: 6px; }

    /* ===========================
       FOOTER
    =========================== */
    .footer {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 60px 0 30px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px; margin-bottom: 48px;
    }
    .footer-logo {
      font-family: 'Manrope', sans-serif;
      font-size: 24px; font-weight: 800; margin-bottom: 14px;
    }
    .footer-logo span { color: var(--primary); }
